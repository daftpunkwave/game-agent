# Repository Hygiene Check
#
# Responsibilities: Verify whitespace/conflict markers and basic file hygiene on pull requests, and on demand.
# Contracts: Uses git only (no dependency install); reports the required check `hygiene`. Pull requests check their diff against the base; manual runs check the whole tree of the selected ref.
# Constraints: Must fail loudly on whitespace errors, conflict markers, or tracked .env files. Does not run on pushes to main because merged trees were already checked as up-to-date pull requests; renaming the job requires updating the required checks of the `main` ruleset.
name: repo-hygiene

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check git diff whitespace and conflict markers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

      - name: Ensure no .env credential files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "Error: tracked .env file detected"
            exit 1
          fi
