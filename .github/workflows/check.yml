# Repository Check
#
# Responsibilities: Run the repository gate for pull requests and on demand: the full gate once on Linux, and the platform-sensitive part on Windows.
# Contracts: Uses the pnpm version pinned in package.json and Node.js 24; reports one required check per runner. `check (ubuntu-latest)` runs `pnpm check` (build with type checking, tests, package boundaries and project references, file headers, third-party notices, running the compiled output). `check (windows-latest)` runs `pnpm build`, `pnpm test`, and `pnpm check:smoke`: the build is needed to run the compiled output, tests and the compiled output are platform-sensitive, and the static repository checks give the same result everywhere, so they run only on Linux.
# Constraints: Does not run on pushes to main: the `main` ruleset requires pull requests to be up to date with main and to pass this check, so the squashed tree is the tree already checked. Runs on pull request open, reopen, and new commits, not on title or description edits. Actions are pinned by commit SHA; jobs have read-only repository permissions; renaming a job or matrix entry requires updating the required checks of the `main` ruleset.
name: check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gate: pnpm check
          - os: windows-latest
            gate: pnpm build && pnpm test && pnpm check:smoke
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository gate
        shell: bash
        run: ${{ matrix.gate }}
