# Repository Check
#
# Responsibilities: Run the full repository gate (type checking, tests, package boundaries, file headers) on pushes and pull requests.
# Contracts: Uses the pnpm version pinned in package.json and Node.js 24; fails when `pnpm check` fails.
# Constraints: Actions are pinned by commit SHA; the job has read-only repository permissions.
name: check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository gate
        run: pnpm check
