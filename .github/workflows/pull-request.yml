# Pull Request Policy
#
# Responsibilities: Check pull request conventions before a pull request can merge.
# Contracts: Reports the required check `conventions` (Conventional Commits and English-only rules for the title, description, and every non-merge commit, via scripts/check-conventions.ts).
# Constraints: Also runs when the title or description is edited, because the squash commit title comes from the pull request title. Runs only on pull_request events with a read-only token, so fork pull requests never receive secrets; untrusted PR text reaches the script through environment variables, never through expression interpolation in shell code; actions are pinned by commit SHA; renaming the job requires updating the required checks of the `main` ruleset.
name: pull-request

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check title, description, and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-conventions.ts --range "origin/${BASE_REF}..${HEAD_SHA}"
